<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fixsmith Reports</title>
    <link rel="stylesheet" href="/assets/styles.css" />
  </head>
  <body>
    <div class="app">
      <aside id="appSidebar" class="sidebar"></aside>
      <main class="content" id="reportRoot">
        <header class="hero">
          <div class="hero-text">
            <p class="eyebrow">Reporting</p>
            <h1>Job Completion Reports</h1>
            <p class="subtitle">Compile completed jobs over a selected period and generate a clean printable report.</p>
          </div>
        </header>

      <section class="panel report-controls">
        <div class="report-filters">
          <label>Preset
            <select id="reportPreset">
              <option value="thisMonth">This Month</option>
              <option value="last7">Last 7 Days</option>
              <option value="last30">Last 30 Days</option>
              <option value="custom">Custom Range</option>
            </select>
          </label>
          <label>From
            <input id="reportFrom" type="date" />
          </label>
          <label>To
            <input id="reportTo" type="date" />
          </label>
          <label class="filter-check">
            <input id="reportCompletedOnly" type="checkbox" checked />
            Completed jobs only
          </label>
          <button id="reportRunBtn" type="button">Run Report</button>
          <button id="reportPrintBtn" type="button" class="ghost">Print Report</button>
        </div>
        <p id="reportMessage" class="message"></p>
      </section>

      <section id="reportOutput" class="panel report-print-area">
        <div class="report-header">
          <h2>Fixsmith Service Report</h2>
          <p id="reportPeriodLabel">Period: -</p>
          <p id="reportGeneratedAt">Generated: -</p>
        </div>

        <div class="metric-grid">
          <article>
            <span class="metric-label">Jobs In Period</span>
            <strong id="reportMetricTotal">0</strong>
          </article>
          <article>
            <span class="metric-label">Completed</span>
            <strong id="reportMetricCompleted">0</strong>
          </article>
          <article>
            <span class="metric-label">Unique Customers</span>
            <strong id="reportMetricCustomers">0</strong>
          </article>
        </div>

        <section class="report-section">
          <h3>Status Breakdown</h3>
          <ul id="reportStatusBreakdown" class="status-breakdown"></ul>
        </section>

        <section class="report-section">
          <h3>Jobs</h3>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Due Date</th>
                  <th>Customer</th>
                  <th>Device</th>
                  <th>Issue</th>
                  <th>Status</th>
                </tr>
              </thead>
              <tbody id="reportRows"></tbody>
            </table>
          </div>
        </section>
      </section>
    </main>

    </div>
    <script src="/assets/sidebar.js"></script>
    <script type="module" src="/assets/reports.js"></script>
  </body>
</html>
